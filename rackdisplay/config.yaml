name: Rack Display
version: "1.1.0"
slug: rackdisplay
description: SSD1306 OLED info screen with a hardware button (reboot/shutdown) for a Raspberry Pi rack
url: https://github.com/jorissynaeve/homeassistant_rackdisplay
arch:
  - aarch64
  - armv7
startup: services
boot: auto
init: false
# Supervisor API: host/network info, reboot and shutdown of the host
hassio_api: true
hassio_role: manager
# I2C bus (OLED) and GPIO character device (button + LED).
# I2C must be enabled on Home Assistant OS first, see DOCS.md.
devices:
  - /dev/i2c-1
  - /dev/gpiochip0
options:
  i2c_bus: 1
  i2c_address: "0x3C"
  display_width: 128
  display_height: 32
  rotate_180: true
  contrast: 255
  high_brightness: true
  bold_text: true
  button_pin: 20
  button_pull_up: true
  led_pin: 23
  gpio_chip: 0
  display_timeout: 15
  reboot_hold_seconds: 5
  shutdown_hold_seconds: 10
  log_level: info
schema:
  i2c_bus: int(0,10)
  i2c_address: str
  display_width: int(32,256)
  display_height: list(32|64)
  rotate_180: bool
  contrast: int(0,255)
  high_brightness: bool
  bold_text: bool
  button_pin: int(0,60)
  button_pull_up: bool
  led_pin: int(0,60)
  gpio_chip: int(0,10)
  display_timeout: int(1,3600)
  reboot_hold_seconds: int(1,60)
  shutdown_hold_seconds: int(2,120)
  log_level: list(debug|info|warning|error)
